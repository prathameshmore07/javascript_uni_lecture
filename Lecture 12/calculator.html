<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>

<body>

    <div class="numbers">
        <div>0</div>
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
    </div>

    <div class="Operators">
        <div>+</div>
        <div>-</div>
        <div>*</div>
        <div>/</div>
        <div id="equal">=</div>
    </div>

    <div id="display" style="width:150px; border:2px solid black; padding:18px; margin-top:10px;"></div>

    <script>
        let numbers = document.querySelectorAll('.numbers div');
        let operators = document.querySelectorAll('.Operators div:not(#equal)');
        let equal = document.querySelector('#equal');
        let display = document.querySelector('#display');

        numbers.forEach((number) => {
            number.addEventListener('click', () => {
                display.innerText += number.innerText;
            });
        });

        operators.forEach((operator) => {
            operator.addEventListener('click', () => {
                display.innerText += operator.innerText;
            });
        });

        equal.addEventListener('click', () => {
            display.innerText = eval(display.innerText);
        });
    </script>

</body>

</html>
